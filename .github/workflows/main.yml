name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/example/webviewapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/example/webviewapp/MainActivity.java << 'EOF'
          package com.example.webviewapp;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.widget.FrameLayout;
          import android.content.pm.ActivityInfo;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import java.io.ByteArrayInputStream;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private View mCustomView;
              private WebChromeClient.CustomViewCallback mCustomViewCallback;
              private int mOriginalOrientation;

              private static final Set<String> AD_DOMAINS = new HashSet<>(Arrays.asList(
                  "doubleclick.net", "googleadservices.com", "googlesyndication.com",
                  "adnxs.com", "criteo.com", "outbrain.com", "taboola.com",
                  "ads.abyss.to", "popup.ads", "jads.co"
              ));

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // 🔥 QUAN TRỌNG: Tắt fitSystemWindows ngay từ đầu để tràn viền
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setBuiltInZoomControls(false);
                  webSettings.setDisplayZoomControls(false);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setSupportZoom(false);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setSupportMultipleWindows(true);
                  webSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  
                  webView.setWebViewClient(new MyWebViewClient());
                  webView.setWebChromeClient(new MyWebChromeClient());
                  
                  webView.loadUrl("https://web.telegram.org");
              }

              private class MyWebViewClient extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, String url) {
                      Uri uri = Uri.parse(url);
                      if (uri.getHost() != null &&
                          (uri.getHost().contains("youtube.com") ||
                           uri.getHost().contains("youtu.be") ||
                           uri.getHost().contains("m.youtube.com"))) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.setPackage("com.google.android.youtube");
                          if (intent.resolveActivity(getPackageManager()) != null) {
                              startActivity(intent);
                              return true;
                          } else {
                              Intent browserIntent = new Intent(Intent.ACTION_VIEW, uri);
                              startActivity(browserIntent);
                              return true;
                          }
                      }
                      return false;
                  }

                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                      String url = request.getUrl().toString();
                      if (isAdUrl(url)) {
                          return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream("".getBytes()));
                      }
                      return super.shouldInterceptRequest(view, request);
                  }
              }

              private boolean isAdUrl(String url) {
                  if (url == null) return false;
                  for (String domain : AD_DOMAINS) {
                      if (url.contains(domain)) return true;
                  }
                  return false;
              }

              private class MyWebChromeClient extends WebChromeClient {
                  private View mVideoProgressView;

                  @Override
                  public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, android.os.Message resultMsg) {
                      WebView newWebView = new WebView(MainActivity.this);
                      newWebView.setWebViewClient(new MyWebViewClient());
                      ((WebView.WebViewTransport) resultMsg.obj).setWebView(newWebView);
                      resultMsg.sendToTarget();
                      return true;
                  }

                  @Override
                  public void onShowCustomView(View view, WebChromeClient.CustomViewCallback callback) {
                      if (mCustomView != null) {
                          callback.onCustomViewHidden();
                          return;
                      }
                      mCustomView = view;
                      mCustomViewCallback = callback;
                      mOriginalOrientation = getRequestedOrientation();

                      FrameLayout decor = (FrameLayout) getWindow().getDecorView();
                      
                      // 🔥 Ép view chiếm toàn bộ màn hình (MATCH_PARENT tuyệt đối)
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT);
                      decor.addView(mCustomView, params);

                      webView.setVisibility(View.GONE);
                      
                      // 🔥 ẨN THANH ĐIỀU HƯỚNG BẰNG API MỚI (Triệt để hơn)
                      hideSystemUI();
                      
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  }

                  @Override
                  public void onHideCustomView() {
                      if (mCustomView == null) return;

                      setRequestedOrientation(mOriginalOrientation);
                      
                      FrameLayout decor = (FrameLayout) getWindow().getDecorView();
                      decor.removeView(mCustomView);
                      mCustomView = null;
                      
                      webView.setVisibility(View.VISIBLE);
                      
                      // 🔥 HIỆN LẠI SYSTEM UI
                      showSystemUI();

                      if (mCustomViewCallback != null) {
                          mCustomViewCallback.onCustomViewHidden();
                          mCustomViewCallback = null;
                      }
                  }

                  @Override
                  public View getVideoLoadingProgressView() {
                      if (mVideoProgressView == null) {
                          mVideoProgressView = new View(MainActivity.this);
                      }
                      return mVideoProgressView;
                  }
              }
              
              // 🔥 HÀM ẨN UI MỚI: Ẩn cả Status Bar và Navigation Bar
              private void hideSystemUI() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }

              // 🔥 HÀM HIỆN UI MỚI
              private void showSystemUI() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false); // Vẫn giữ false để nội dung tràn viền
                  WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.show(WindowInsetsCompat.Type.systemBars());
              }

              @Override
              public void onBackPressed() {
                  if (mCustomView != null) {
                      webView.getWebChromeClient().onHideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # 🔥 SỬA LAYOUT XML: fitsSystemWindows="false" để fix vạch trắng
      - name: Create layout file
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="false"> 
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Telegram</string>
          </resources>
          EOF

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:fitsSystemWindows">false</item>
              </style>
          </resources>
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <package android:name="com.google.android.youtube" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:hardwareAccelerated="true"
                      android:exported="true"
                      android:theme="@style/AppTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # 🔥 FIX DUPLICATE CLASS KOTLIN
      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.example.webviewapp'
              defaultConfig {
                  applicationId "com.example.webviewapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.10.1' 
              
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Create gradle-wrapper.properties
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "NetflopApp"
          include ':app'
          EOF

      - name: Create empty proguard-rules.pro
        run: touch app/proguard-rules.pro

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Generate dummy icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -size 192x192 xc:blue app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netflop-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
